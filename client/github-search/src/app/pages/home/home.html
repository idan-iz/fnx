<div class="home">
    <div class="main-container">
        @if(regOrLogin) {
        <app-login></app-login>
        } @else {
        <app-register></app-register>
        }
        <div class="actions">
            <button mat-flat-button class="toggle-reg-login-btn" (click)="onTogggleRegOrLogin()">
                {{ regOrLogin ? 'Go to Register' : 'Go to Login' }}
            </button>
        </div>
    </div>
</div>
