@if (generalService.error$(); as errorMsg) {
<div class="error-toast" role="alert" aria-live="assertive">
  <div class="error-toast-icon">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
  </div>
  <div class="error-toast-content">
    <span class="error-toast-title">Error Occurred</span>
    <p class="error-toast-message">{{ errorMsg }}</p>
  </div>
  <button class="error-toast-close" (click)="onClose()" aria-label="Dismiss error">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>
}
